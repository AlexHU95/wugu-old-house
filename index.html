 10px; text-indent: 10px; }\n    .title-start { min-width: 160px; padding: 12px 20px; }\n    .panel-action .panel-body { max-height: 30vh; max-height: 30dvh; }\n  }\n\n  /* 手机横屏：提示竖屏使用。只对「触屏 + 矮窗口」生效，\n     桌面把窗口拉宽（有鼠标）不会命中，正常显示竖屏画布。 */\n  #rotate-hint { display: none; }\n  @media (orientation: landscape) and (pointer: coarse) and (max-height: 500px) {\n    #rotate-hint { position: fixed; top:0; right:0; bottom:0; left:0; z-index:900;\n      display: flex; align-items: center; justify-content: center;\n      background: #0b0906; color: var(--gold-dim);\n      font-size: 14px; letter-spacing: 2px; line-height: 2.1; text-align: center; padding: 24px; }\n  }\n\n  /* ---------- A1 氛围层（v1.2.0）：雨 / 雾 / 晕影 ----------\n     纯 CSS + Canvas 2D，零依赖、零外链、不产生网络请求。\n     为什么不直接上 three.js：主体是文本 DOM，WebGL 要持续占 GPU；而库必须整包内联\n     （CSP 禁外链），体积会从 172 KB 涨到约 904 KB。雨用 Canvas 2D 画只要十几 KB。\n     ⚠ 两条硬约束（都是这个项目踩过的）：\n       ① 不用 inset:0 —— 微信 X5 旧内核会忽略它（同上方弹窗那条坑），必须写四件套；\n       ② pointer-events:none —— 否则整层会吃掉竖屏拇指区的点击。 */\n  #fx { position: fixed; top:0; right:0; bottom:0; left:0; z-index:55;\n    pointer-events:none; overflow:hidden; }\n  #fx canvas { position:absolute; top:0; right:0; bottom:0; left:0;\n    width:100%; height:100%; display:block; transition:opacity 1.2s ease; }\n  /* 雾：三层缓慢漂移的径向渐变，只动 transform/opacity（不触发重排） */\n  .fx-fog { position:absolute; top:-20%; right:-20%; bottom:-20%; left:-20%;\n    background: radial-gradient(ellipse at 30% 40%, rgba(122,134,152,.11) 0%, rgba(122,134,152,0) 62%);\n    animation: fxDriftA 52s ease-in-out infinite alternate; }\n  .fx-fog.b { background: radial-gradient(ellipse at 70% 62%, rgba(92,106,126,.10) 0%, rgba(92,106,126,0) 58%);\n    animation: fxDriftB 71s ease-in-out infinite alternate; }\n  .fx-fog.c { background: radial-gradient(ellipse at 50% 88%, rgba(62,72,90,.11) 0%, rgba(62,72,90,0) 66%);\n    animation: fxDriftC 89s ease-in-out infinite alternate; }\n  @keyframes fxDriftA { from{transform:translate3d(-3%,-2%,0) scale(1)} to{transform:translate3d(4%,3%,0) scale(1.12)} }\n  @keyframes fxDriftB { from{transform:translate3d(3%,2%,0) scale(1.08)} to{transform:translate3d(-4%,-3%,0) scale(1)} }\n  @keyframes fxDriftC { from{transform:translate3d(0,3%,0) scale(1)} to{transform:translate3d(2%,-3%,0) scale(1.15)} }\n  /* 晕影：随异象加强（--fx-vig 由 JS 写入），阶段越高越偏冷/偏红。\n     ⚠ 暗环必须从中心 62% 才开始 —— 之前是 40%，异象 7 时会把剧情区上下两端一起压暗，\n       读起来像\"文字发灰\"。氛围可以重，但不能吃掉阅读区。 */\n  #fx-vig { position:absolute; top:0; right:0; bottom:0; left:0;\n    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, var(--fx-vigcol, rgba(0,0,0,.55)) 100%);\n    opacity: var(--fx-vig, .28); transition: opacity 1.6s ease; }\n  body[data-phase=\"2\"] { --fx-vigcol: rgba(16,26,38,.56); }\n  body[data-phase=\"3\"] { --fx-vigcol: rgba(50,18,18,.60); }\n  body[data-phase=\"4\"] { --fx-vigcol: rgba(80,12,12,.66); }\n  /* 异象脉冲：只抖氛围层，不抖文字 —— 抖字会伤阅读，也容易引起晕动 */\n  #fx.pulse { animation: fxPulse .62s ease-out; }\n  @keyframes fxPulse {\n    0%{ transform:translate3d(0,0,0) }\n    18%{ transform:translate3d(-3px,2px,0) }\n    36%{ transform:translate3d(3px,-2px,0) }\n    58%{ transform:translate3d(-2px,-1px,0) }\n    100%{ transform:translate3d(0,0,0) } }\n  /* 无障碍：尊重系统「减弱动态效果」——雨停、雾静，只留静态晕影 */\n  @media (prefers-reduced-motion: reduce) {\n    .fx-fog { animation: none; }\n    #fx.pulse { animation: none; }\n  }\n\n  /* ---------- A2 场景插画（v1.3.0）----------\n     垫在剧情文字下面，两层交替淡入淡出（background-image 不支持过渡，只能动 opacity）。\n     ⚠ 同样不用 inset:0（微信 X5 旧内核会忽略）；\n     ⚠ overflow:hidden 是为了让插画被圆角裁掉，不然四个直角会露在面板外。 */\n  .panel-log { position: relative; overflow: hidden; }\n  .scene-bg { position:absolute; top:0; right:0; bottom:0; left:0;\n    background-position:center; background-size:cover; background-repeat:no-repeat;\n    opacity:0; transition:opacity .8s ease; z-index:0; }\n  /* 压暗层：这是让插画与文字共存的关键。\n     插画里最亮的元素（护符的辉光、油灯）恰好会垫在文字下面，把底衬提亮、吃掉对比度 ——\n     截图里表现为\"文字发灰\"。压暗层只保留插画的形，抹掉它的高光。 */\n  .scene-scrim { position:absolute; top:0; right:0; bottom:0; left:0; z-index:0;\n    background: linear-gradient(180deg, rgba(26,21,16,.60) 0%, rgba(26,21,16,.40) 45%, rgba(26,21,16,.64) 100%); }\n  .panel-log .panel-body { position: relative; z-index: 1; }\n\n\n  /* ---- DSH Game Studio 宿主适配（只覆盖必须覆盖的） ---- */\n  html { background: #0b0906; }\n  canvas#game { display: none !important; }\n  body { user-select: text; -webkit-user-select: text; }\n";

v class=\"title-sub\">CALL OF CTHULHU · 悬疑调查</div>\n    <h1 class=\"title-main\">雾谷旧宅</h1>\n    <div class=\"title-en\">THE OLD HOUSE IN THE FOG VALLEY</div>\n    <button class=\"btn title-start\" id=\"start-btn\" onclick=\"window.__tapStart&&window.__tapStart()\">开始游戏</button>\n    <\!-- 初始文案即「失败态」：若脚本正常执行，会被立刻替换为「已就绪」。\n         这样用户一眼就能判断是环境不执行脚本，而不是按钮坏了。 -->\n    <div class=\"boot-check\" id=\"boot-check\">⚠ 脚本未运行 —— 请点右上角「···」→「在浏览器打开」</div>\n    <noscript>\n      <div class=\"boot-check\">⚠ 当前环境未启用 JavaScript，本 Demo 无法运行。请换用系统浏览器打开。</div>\n    </noscript>\n  </div>\n  <div class=\"title-ver\" id=\"version-btn-title\">v1.3.0</div>\n</div>\n\n<div class=\"modal\" id=\"howto-modal\" style=\"display:none\">\n  <div class=\"modal-inner\">\n    <h2>怎么玩</h2>\n    <p class=\"lead\">1927 年，阿卡姆镇外。你是被雇来查一桩失踪案的调查员。</p>\n    <div class=\"howto\">\n      <div class=\"howto-row\"><span class=\"howto-k\">目标</span><span class=\"howto-v\">查清查尔斯·温特的失踪，并尽量活着离开。</span></div>\n      <div class=\"howto-row\"><span class=\"howto-k\">行动</span><span class=\"howto-v\">点右侧列表里的按钮。<b>深色</b>的是调查 / 交涉 / 取物，<b>暗色</b>的是移动。每次只能选一个。</span></div>\n      <div class=\"howto-row\"><span class=\"howto-k\">判定</span><span class=\"howto-v\">掷 D100，<b>不超过目标值即成功</b>。掷得越低越好：大成功 &gt; 困难成功 &gt; 普通成功 &gt; 失败 &gt; 大失败。</span></div>\n      <div class=\"howto-row\"><span class=\"howto-k\">知识</span><span class=\"howto-v\">你查到的每一条线索，都会变成之后判定的加成。<b>同一件事，知道得越多越容易做成。</b>右上角「线索」随时回看查到了什么。</span></div>\n      <div class=\"howto-row\"><span class=\"howto-k\">一次性</span><span class=\"howto-v\">每个行动只做一次，<b>一次定结果</b>。找不到就是找不到——所以先查什么，很关键。</span></div>\n      <div class=\"howto-row\"><span class=\"howto-k\">异象强度</span><span class=\"howto-v\">左上角的进度条。它会<b>自己上涨</b>，也会被你闹出的动静推高。强度越高，宅子越危险。</span></div>\n      <div class=\"howto-row\"><span class=\"howto-k\">理智</span><span class=\"howto-v\">直面不该看的东西会掉 SAN。<b>掉光就结束了。</b></span></div>\n    </div>\n    <div class=\"howto-tip\">提示：行动列表里的选项会随你的状态变化——查到什么、拿到什么、惊动到什么，都会改变你能做的事。</div>\n /* ============================================================
 * 雾谷旧宅 · 判定引擎（v1.0）
 *
 * 从前身 v2 继承：三维正交判定 + 知识去冗余 + 分层（细档位叙事 / 粗门槛世界变化）
 * 本版新增三项扩展：
 *   ① 道具门槛    —— 行动可声明 requires.items
 *   ② 揭示产出物品 —— 揭示层可直接授予 item
 *   ③ 世界状态     —— world.flags 参与规则推导
 * ============================================================ */
var Engine = (function () {
  "use strict";

  /* ---------- 意图 ---------- */
  var INTENTS = {
    observe:   { label: "观察", danger: 0, noise: 0, contact: 2 },
    traverse:  { label: "移动", danger: 0, noise: 0, contact: 0 },
    social:    { label: "交涉", danger: 1, noise: 1, contact: 1 },
    search:    { label: "翻找", danger: 1, noise: 1, contact: 1 },
    take:      { label: "拿取", danger: 2, noise: 2, contact: 1 },
    destroy:   { label: "破坏", danger: 3, noise: 3, contact: 1 },
    intervene: { label: "干预", danger: 3, noise: 3, contact: 0 }
  };

  var TIER_VAL = { crit: 3, hard: 2, success: 1, fail: -1, fumble: -4 };
  var TIER_CN = { crit: "大成功", hard: "困难成功", success: "普通成功", fail: "失败", fumble: "大失败" };
  var ACH_ORDER = { "反效果": -1, "未达成": 0, "部分达成": 1, "达成": 2, "完全达成": 3 };
  var ACH_BANDS = [
    { min: 2, name: "完全达成" }, { min: 0, name: "达成" },
    { min: -2, name: "部分达成" }, { min: -4, name: "未达成" },
    { min: -Infinity, name: "反效果" }
  ];
  var COST_BANDS = [
    { min: 5, name: "严重" }, { min: 3, name: "中度" },
    { min: 1, name: "轻微" }, { min: -Infinity, name: "无" }
  ];

  function bandOf(score, bands) {
    for (var i = 0; i < bands.length; i++) if (score >= bands[i].min) return bands[i].name;
    return bands[bands.length - 1].name;
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function verdict(roll, target) {
    if (roll <= 5) return "crit";
    if (roll >= 96) return "fumble";
    if (roll <= Math.floor(target / 2)) return "hard";
    if (roll <= target) return "success";
    return "fail";
  }

  /* 去冗余：被其他已知 fact 蕴含的整条剔除
   * ⚠ 数据约定：A implies B 时，A 的 method/protect 必须是含 B 在内的超集 */
  function effectiveFacts(world, FACTS) {
    var have = (world.facts || []).filter(function (f) { return !!FACTS[f]; });
    var redundant = {};
    have.forEach(function (f) {
      ((FACTS[f].implies) || []).forEach(function (r) { redundant[r] = true; });
    });
    return have.filter(function (f) { return !redundant[f]; });
  }

  /**
   * 核心判定。
   * @param world  { actor, facts, items, flags, scene:{npc}, enemy:{terror} }
   * @param intent { kind, target }
   * @param TABLES { OBJECTS, FACTS }
   * @param forcedRoll 可选，便于测试
   */
  function resolve(world, intent, TABLES, forcedRoll) {
    var OBJECTS = TABLES.OBJECTS, FACTS = TABLES.FACTS;
    var obj = OBJECTS[intent.target];
    if (!obj) throw new Error("未知对象: " + intent.target);
    var I = INTENTS[intent.kind];
    if (!I) throw new Error("未知意图: " + intent.kind);

    var difficulty = obj.diff[intent.kind] != null ? obj.diff[intent.kind] : 2;

    /* 选技能：对象可指定该意图对应的技能，否则按候选里最高的算 */
    var skillName = null, skillTarget = 20;
    var cands = (obj.skill && obj.skill[intent.kind]) || intent.skill || null;
    if (cands) {
      var list = Array.isArray(cands) ? cands : [cands];
      list.forEach(function (sn) {
        var v = world.actor.skills[sn] || 0;
        if (v > skillTarget - 1 || skillName === null) { if (v > skillTarget || skillName === null) { skillName = sn; skillTarget = v; } }
      });
      if (skillName === null) { skillName = list[0]; skillTarget = world.actor.skills[list[0]] || 20; }
    }

    var roll = forcedRoll != null ? forcedRoll : Math.floor(Math.random() * 100) + 1;
    var tier = verdict(roll, skillTarget);
    var tierVal = TIER_VAL[tier];

    var facts = effectiveFacts(world, FACTS);
    var sum = function (field) {
      return facts.reduce(function (a, f) {
        return a + (((FACTS[f][field]) || {})[intent.kind] || 0);
      }, 0);
    };
    var methodBonus = sum("method");
    var protectBonus = sum("protect");
    var wounded = world.actor.hp <= world.actor.hpMax / 2 ? 1 : 0;

    /* 只有【真正参与本次判定】的知识才算「用上了」——
     * 否则会把玩家已有的全部知识都列出来，变成无意义的复述。
     * 下游用 fact.echo（应用句）呈现，而不是 fact.text（原始线索）。 */
    var appliedFacts = facts.filter(function (f) {
      var F = FACTS[f];
      return (((F.method) || {})[intent.kind] || 0) !== 0
          || (((F.protect) || {})[intent.kind] || 0) !== 0;
    });

    /* ① 达成分 */
    var achScore = tierVal + methodBonus - difficulty - wounded;
    var achievement = bandOf(achScore, ACH_BANDS);

    /* ② 代价分（因子集与达成分不重叠） */
    var exposure = I.danger + Math.floor((world.enemy ? world.enemy.terror : 0) / 5);
    var costScore = exposure - tierVal - protectBonus;
    var costLevel = bandOf(costScore, COST_BANDS);
    var cost = {
      level: costLevel,
      hp: { "无": 0, "轻微": 0, "中度": 1, "严重": 2 }[costLevel],
      san: (costLevel === "严重" && world.enemy && world.enemy.terror >= 7) ? 1 : 0,
      noise: (I.noise > 0 && costLevel !== "无") ? 1 : 0
    };

    /* ③ 揭示分（不含难度，与达成度解耦）
     * 揭示是【累积】的：看到第 N 层 = 同时看到 0..N 层全部内容。
     * 否则掷得越好反而会跳过浅层的关键发现（如「发现暗门」）。 */
    var insight = tierVal + I.contact + Math.min(facts.length, 3);
    var reveal = null, revealLayer = -1, revealedClues = [];
    var newFacts = [], newItems = [], newFlags = [];
    /* 细档位管叙事、粗门槛管结构：
     * insight 决定挖到第几层（0..3）；其中第 4 层是「冗余来源」层，
     * 改挂粗门槛 ord>=1 —— 一次掷差不该让玩家永久失去某条知识的第二个来源。 */
    var maxLayer = Math.min(3, (obj.layers ? obj.layers.length : 1) - 1);
    if (insight >= 0 && obj.layers && obj.layers.length) {
      revealLayer = clamp(insight <= 1 ? 0 : (insight <= 3 ? 1 : (insight <= 5 ? 2 : 3)), 0, maxLayer);
      if (maxLayer >= 3 && ACH_ORDER[achievement] >= 1) revealLayer = 3;
      for (var li = 0; li <= revealLayer; li++) {
        var L = obj.layers[li];
        if (L.clue) revealedClues.push(L.clue);
        if (L.fact && newFacts.indexOf(L.fact) < 0) newFacts.push(L.fact);
        if (L.item && newItems.indexOf(L.item) < 0) newItems.push(L.item);
        if (L.flag && newFlags.indexOf(L.flag) < 0) newFlags.push(L.flag);
      }
      reveal = revealedClues[revealedClues.length - 1] || null;
    }

    var delta = deriveDelta(world, intent, obj, achievement, {
      ord: ACH_ORDER[achievement], cost: cost, flags: world.flags || {}, tier: tier
    });
    /* 揭示层可直接写入世界状态（如「发现暗门」） */
    newFlags.forEach(function (f) { delta.flags[f] = true; });

    /* 【修复 ③】规则 3 / 规则 10 会把【可交互对象】的 id 当成【道具】id 塞进背包：
     * 带「可拾取」标签的是 pantryLoot（储藏室杂物）、hearth（客厅壁炉）和 amulet（护符），
     * 前两个不在 ITEMS 表里（ITEMS 只有 key / crowbar / amulet）。背包一旦混入 "hearth"，
     * 界面读 Content.ITEMS["hearth"].name 就抛 TypeError，行动链当场断掉。
     * 真道具本来就由揭示层的 L.item 授予（撬棍 / 旧钥匙），所以这里只保留真道具 id。 */
    if (delta.items && delta.items.length) {
      delta.items = delta.items.filter(function (id) {
        return !!(TABLES.ITEMS && TABLES.ITEMS[id]);
      });
    }

    return {
      action: I.label + "·" + obj.name,
      kind: intent.kind, target: intent.target,
      skill: skillName, roll: roll, target: skillTarget, tier: TIER_CN[tier], tierRaw: tier, tierVal: tierVal,
      factsUsed: appliedFacts, methodBonus: methodBonus, protectBonus: protectBonus, difficulty: difficulty,
      achScore: achScore, achievement: achievement,
      costScore: costScore, cost: cost,
      insight: insight, reveal: reveal, revealLayer: revealLayer, revealedClues: revealedClues,
      newFacts: newFacts, newItems: newItems, newFlags: newFlags,
      newFact: newFacts[0] || null, newItem: newItems[0] || null, newFlag: newFlags[0] || null,
      delta: delta
    };
  }

  /* ============================================================
   * 世界变化规则（10 条）
   * 原则：硬性变化挂在【粗门槛】上（ord），细档位只影响叙事
   * ============================================================ */
  function deriveDelta(world, intent, obj, achievement, ctx) {
    var d = { npc: {}, process: [], enemyAdvance: 0, items: [], flags: {}, log: [] };
    var ord = ctx.ord;
    var tags = obj.tags || [];
    var has = function (t) { return tags.indexOf(t) >= 0; };

    /* 规则 0：大失败永远有后果 —— 即使分数落在「未达成」区间 */
    if (ctx.tier === "fumble") ord = -1;

    /* 规则 1：反效果 → 帮倒忙（敌方推进；交涉则激怒对方），且不产生任何正面效果 */
    if (ord < 0) {
      d.enemyAdvance = 1;
      d.log.push("弄巧成拙");
      if (intent.kind === "social" && world.scene.npc) d.npc.charles = "敌意";
      return d;
    }
    /* 规则 2：未达成 → 场景维持原状（关键一致性保证） */
    if (ord === 0) return d;

    /* ── 以下仅当「部分达成」及以上 ── */

    /* 规则 3：挪动枢纽 → 过程崩解 + NPC 依当前状态迁移 */
    if (intent.kind === "take" && has("枢纽")) {
      d.process.push("仪式失去阵眼");
      d.items.push(intent.target);
      d.flags.secret_ritual_broken = true;
      if (world.scene.npc && world.scene.npc.charles === "沉浸") d.npc.charles = "动摇";
      d.enemyAdvance = 1;
    }
    /* 规则 4：破坏枢纽 → 过程终结 */
    if (intent.kind === "destroy" && has("枢纽")) {
      d.process.push("仪式崩解");
      d.flags.ritual_destroyed = true;
      d.enemyAdvance = -1;
    }
    /* 规则 5：交涉 → NPC 分级迁移（按【交涉目标】判定，支持多个 NPC）
     * 查尔斯：沉浸 → 动摇 → 清醒 / 敌意
     * 艾米莉（妹妹）：门外 → 焦急 → 知情 / 崩溃 */
    if (intent.kind === "social" && world.scene.npc) {
      var LADDERS = {
        charles: { up: "清醒", mid: "动摇", down: "敌意" },
        emily: { up: "知情", mid: "焦急", down: "崩溃" }
      };
      var who = LADDERS[intent.target] ? intent.target : "charles";
      var ladder = LADDERS[who];
      var cur = world.scene.npc[who];
      if (cur && ladder) {
        var next = ord >= 2 ? ladder.up : (ord === 1 ? ladder.mid : ladder.down);
        if (next !== cur) d.npc[who] = next;
      }
    }

    /* 规则 5b：【修复 ①】special「letHim」→ 清醒的查尔斯亲手取下护符，交到你手里。
     * 为什么需要它：自己夺护符（take / amulet）在敌方状态机里是 clock+99、threat+4 的
     * 自杀式动作；「先唤醒他、再让他动手」才是安全路线，也是通往最佳结局
     * 「黎明破晓」（ritual_destroyed + 他清醒）的正路。
     * 这条分支此前只在内容里声明了 special、引擎从不读取，等于点了一次普通交涉 —— 死分支。
     * 门槛遵循本作原则走粗门槛 ord>=1（未达成时规则 2 已提前 return，场景维持原状）。 */
    if (intent.special === "letHim" && ord >= 1) {
      d.process.push("查尔斯亲手取下护符");
      if (d.items.indexOf("amulet") < 0) d.items.push("amulet");
    }
    /* 规则 6：开启通道 → 世界状态改变 */
    if (has("通道") && (intent.kind === "take" || intent.kind === "destroy" || intent.kind === "traverse")) {
      d.flags["opened_" + intent.target] = true;
      d.log.push("通道开启：" + obj.name);
    }
    /* 规则 7：动静 → 惊动 */
    if (ctx.cost.noise && ord <= 2 && has("易响")) {
      d.flags.alarmed = true;
      d.log.push("惊动了宅子");
    }
    /* 规则 8：潜行达标 → 未被察觉（供后续场景判定） */
    if (intent.kind === "traverse" && intent.stealth) {
      if (ord >= 2) d.flags.stealth = true; else d.flags.spotted = true;
    }
    /* 规则 9：观察达到深层 → 额外看穿一层 */
    if (intent.kind === "observe" && achievement === "完全达成") {
      d.log.push("看穿了更深一层");
    }
    /* 规则 10：取得道具 */
    if (has("可拾取") && ord >= 2) {
      if (d.items.indexOf(intent.target) < 0) d.items.push(intent.target);
    }
    /* 规则 11：成功的拿取 / 破坏 → 记录完成标记
     * 供场景出口解锁使用（如「撬开铁门」→ 才能推开正门进前厅） */
    if (intent.kind === "take" || intent.kind === "destroy") {
      d.flags["did_" + intent.target] = true;
    }

    return d;
  }

  return {
    INTENTS: INTENTS, TIER_VAL: TIER_VAL, TIER_CN: TIER_CN,
    ACH_ORDER: ACH_ORDER, ACH_BANDS: ACH_BANDS, COST_BANDS: COST_BANDS,
    bandOf: bandOf, verdict: verdict, effectiveFacts: effectiveFacts,
    resolve: resolve, deriveDelta: deriveDelta
  };
})();

  /* special 的命中优先级最高：同一个对象上可能挂着语义完全不同的同 kind 行动
   *（「低声呼唤他」vs「让他自己取下护符」都是 social + charles）。 */
  function narrate(kind, target, achievement, special) {
    return (special && NARRATIVE[kind + "|" + special + "|" + achievement])
        || NARRATIVE[kind + "|" + target + "|" + achievement]
        || NARRATIVE[kind + "|" + achievement]
        || "……";
  }

  /* ---------- 场景插画（v1.3.0）----------

   * 设计约束：它要垫在剧情文字下面，只有约 18% 的不透明度 → 细节全部会糊掉，
   * 所以每张只画「一眼能认出来的大形」，靠明度差而不是靠线条密度。

/* ============================================================
 * 雾谷旧宅 · 敌方「计划状态机」 —— 可测试的纯逻辑模块
 *
 * 设计目标（对应讨论结论）：
 *   - 敌方目标不是「杀玩家」，而是「推进自己的苏醒计划」
 *   - 两条驱动源：自主时钟（慢性） + 事件触发（戏剧性）

 *   - 三个输出维度：恐怖等级(terror) / 揭示进度(revelation) / 威胁等级(threat)

   *

   *   低语 ≈ 前 9 回合（探索一层） ｜ 蠕动 ≈ 中段（二层） ｜ 逼近 ≈ 后段（地下）
   *   「现身」只能由 enter_altar 事件触发，不由时钟推进 */
  var PHASES = [
    { id: 0, name: "沉睡", base: 0, span: 0, clockLimit: Infinity },
    { id: 1, name: "低语", base: 1, span: 2, clockLimit: 12 },
    { id: 2, name: "蠕动", base: 4, span: 2, clockLimit: 14 },
    /* 「逼近 → 现身」不再由时钟推进：现身只由【进入祭坛室】这一个事件触发，

    { id: 3, name: "逼近", base: 7, span: 1, clockLimit: Infinity },
    { id: 4, name: "现身", base: 9, span: 1, clockLimit: Infinity }
  ];

  /* 第七日 = 敌方计划完成的时刻。

   * 总进度约 186，阈值取 215 留出约 10% 余量 ——
   * 认真打完不会判负，反复回溯的玩家会被它追上。 */

  var MAX_PHASE = PHASES.length - 1;

   * 这是「无断崖」的关键 —— 单纯让阶段不跳级并不够，
   * 阶段边界仍会让恐怖值一次性跳很多（例如 1 → 4）。 */

   * reveal   : 对揭示进度的贡献
   * phaseJump: 直接跳到指定阶段（事件触发）

   * 注：不再有 exposure 字段。理智损耗只由「阶段跃升」驱动，

   */
  var ACTIONS = {
    enter_house:    { clock: 1,  threat: 0,  reveal: 0,  phaseJump: 1, tag: "进入宅邸" },
    investigate:    { clock: 1,  threat: 0,  reveal: 12, tag: "调查线索" },
    move:           { clock: 1,  threat: 0,  reveal: 0,  tag: "移动" },
    alarm:          { clock: 2,  threat: 3,  reveal: 0,  tag: "惊动宅邸" },
    gaze_portrait:  { clock: 1,  threat: 1,  reveal: 4,  tag: "凝视画像" },
    study_runes:    { clock: 1,  threat: 1,  reveal: 10, tag: "研究符文" },
    take_amulet:    { clock: 99, threat: 4,  reveal: 6,  tag: "夺走护符（加速）" },
    wake_charles:   { clock: -2, threat: -2, reveal: 8,  tag: "唤醒查尔斯（推迟）" },
    destroy_amulet: { clock: 0,  threat: 0,  reveal: 20, terminal: "stopped", tag: "毁掉护符（终结）" },
    enter_altar:    { clock: 0,  threat: 2,  reveal: 5,  phaseJump: 4, tag: "进入祭坛室" },
    /* 时间的自主流逝：与玩家行为无关的自行推进 ——「房子自己在醒」 */
    drift:          { clock: 1,  threat: 0,  reveal: 0,  tag: "自行推进" }
  };

  /* ---------- 异常现象库（按阶段分层） ---------- */
  var ANOMALIES = {
    0: ["宅子里静得反常，只有雨点敲在铁门上的声音。"],
    1: [
      "镜中你的倒影，似乎比你的动作慢了半拍。",
      "不知从哪传来一阵极轻的、湿漉漉的刮擦声。",
      "你呼出的白气在屋里久久不散——这里比外面还冷。"
    ],
    2: [
      "那张空摇椅在穿堂风里，自己一下一下地晃着。",
      "地上翻倒的铁锅，无声地转了小半圈。",
      "墙后传来指爪划过石面的声音，一下，又一下。",
      "长桌上的汤匙，自己滑到了桌沿。"
    ],
    3: [
      "你呼出的气凝成白雾——这里的冷，不属于这个季节。",
      "身后的木地板响了一声。你回头，那里空无一人。",
      "墙上的霉斑，似乎拼成了某个你看不懂的图案。",
      "烛火齐齐矮了一截，像有什么从旁边走过。"
    ],
    4: [
      "烛火齐齐熄灭，黑暗中，有什么正缓缓站起身。"
    ]

  /* ---------- 工具 ---------- */
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /* 可复现随机数（mulberry32） */
  function makeRng(seed) {

  function terrorTarget(phase, clock, threat) {
    var p = PHASES[phase];
    var progress = p.clockLimit === Infinity ? 0 : Math.min(1, clock / p.clockLimit);
    return p.base + Math.round(p.span * Math.max(progress, threat / 10));
  }

  /* 恐怖等级的静态参考值（仅由阶段与威胁决定，用于区间校验） */
  function terrorOf(phase, threat) {
    var p = PHASES[phase];
    return p.base + Math.round(p.span * (threat / 10));
  }

  /* 状态化推进：
   *   - 慢燃（时钟驱动）：每步最多 +1，杜绝前几幕的断崖
   *   - 拐点（事件驱动）：允许直接跳到该阶段下界（高潮必须落地），但不超过上限
   *   - 全程单调不减、且不越当前阶段区间上限 */
  function advanceTerror(prevTerror, phase, clock, threat, isEvent) {
    var p = PHASES[phase];
    var bandMax = p.base + p.span;
    var target = terrorTarget(phase, clock, threat);
    if (isEvent) {
      var snapped = Math.min(Math.max(target, p.base), bandMax);
      return Math.max(prevTerror, snapped);
    }
    var next = Math.min(target, prevTerror + TERROR_RATE_CLOCK);
    return Math.max(prevTerror, Math.min(next, bandMax));
  }

  /* 阶段区间（供测试断言） */
  function terrorBand(phase) {
    var p = PHASES[phase];
    return [p.base, p.base + p.span];
  }

  /* 阶段跃升时的旁白 —— 这才是「见识到了不该见识的」的时刻 */
  var ESCALATION = {
    2: "宅子深处，有什么东西改变了呼吸的节奏。",
    3: "整栋房子忽然安静下来——那种安静，像是有东西正屏息注视着你。",
    4: "某个庞大的存在，终于把注意力完全转向了你。"
  };

   * 理由：轻微的异象描写（一声刮擦、一丝冷意）不该夺走理智；
   *       真正让人崩溃的是「它明显比刚才更近了」这个认知跳跃。 */
  function escalationSanLoss(phase, rng) {
    if (phase <= 1) return 0;
    if (phase === 2) return 1;
    if (phase === 3) return 1;

  function create(opts) {

    var san = opts.san != null ? opts.san : 55;

      phase: 0,
      clock: 0,
      totalClock: 0,     /* 第七日专用：只随行动累加，不被阶段重置清零 */
      threat: 0,
      terror: 0,
      revelation: 0,
      san: san,
      sanStart: san,
      sanLost: 0,
      quietStreak: 0,
      terminal: null,
      seed: opts.seed || 1,
      history: []

  /**
   * 推进一步。
   * @param {object} st   状态（会被就地更新）
   * @param {string} actionId 行动 id
   * @param {function} rng 随机源（可选，默认用 state.seed 初始化）
   */
  function step(st, actionId, rng) {

      var frozen = {
        action: actionId, phase: st.phase, phaseName: PHASES[st.phase].name,

        revelation: st.revelation, sanLoss: 0, san: st.san,

      };

    // ① 自主时钟（阶段推进用）+ 总进度（第七日用）
    //    ⚠ 阶段时钟会被事件（enter_altar）重置为 0，所以第七日不能读它 ——
    //      否则倒计时会在进祭坛室时往回跳。总进度是另一本只随行动增减的账。
    if (A.clock) {
      var clockBefore = st.clock;
      st.clock = Math.max(0, st.clock + A.clock);

      st.quietStreak = 0;
    } else {
      st.quietStreak++;
      if (st.quietStreak >= 2) {
        st.threat = clamp(st.threat - 1, 0, 10);
        st.quietStreak = 0;

    var isEvent = A.phaseJump != null;

      if (st.clock >= PHASES[st.phase].clockLimit) {
        st.phase++;
        st.clock = 0;
      }

    if (A.reveal) st.revelation = clamp(st.revelation + A.reveal, 0, 100);

    // ⑥ 终结判定
    if (A.terminal) st.terminal = A.terminal;

    // ⑦ 阶段跃升判定
    var escalated = st.phase > prevPhase;

    // ⑧ San 损耗 —— 只在「跃升」那一步结算。
    //    轻微的异象描写不夺走理智；事件跃升（进祭坛室）的冲击由剧本 enterSan 负责。
    var terror = st.terror;
    var loss = (escalated && !isEvent) ? escalationSanLoss(st.phase, rng) : 0;
    st.san = Math.max(0, st.san - loss);
    st.sanLost += loss;

    var pool = ANOMALIES[st.phase] || ["……"];
    var anomaly = pool[Math.floor(rng() * pool.length) % pool.length];

    var out = {
      action: actionId, actionTag: A.tag,
      phase: st.phase, phaseName: PHASES[st.phase].name,
      terror: terror, threat: st.threat,
      revelation: st.revelation,
      totalClock: st.totalClock,
      escalated: escalated,
      escalationText: escalated ? (ESCALATION[st.phase] || null) : null,
      sanLoss: loss, san: st.san,
      anomaly: anomaly, terminal: st.terminal, frozen: false

  function run(actions, opts) {

    var trace = actions.map(function (a) { return step(st, a, rng); });
    return { state: st, trace: trace };
  }

    PHASES: PHASES, ACTIONS: ACTIONS, ANOMALIES: ANOMALIES, ESCALATION: ESCALATION,
    MAX_PHASE: MAX_PHASE,
    DAY7_CLOCK: DAY7_CLOCK,
    TERROR_RATE_CLOCK: TERROR_RATE_CLOCK,
    terrorOf: terrorOf, terrorTarget: terrorTarget,
    advanceTerror: advanceTerror, escalationSanLoss: escalationSanLoss,
    terrorBand: terrorBand,
    makeRng: makeRng, create: create, step: step, run: run

})();

/* 调试开关：设为 true 会在检定行里显示达成分/方式修正/难度等内部数值 */
const DEBUG_ROLL = false;

let G = null;
let runId = 0;
let pendingAct = null;

function el(id) { return document.getElementById(id); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function initGame(key) {
  const c = CHARACTERS[key];
  const seed = Math.floor(Math.random() * 1e9);
  const em = EnemyMachine.create({ san: 58, seed: seed });
  /* 初始为「沉睡 / 强度 0」—— 还站在门外的雨里，宅子里什么都不会发生。
   * 真正的低语从【进入宅邸】那一刻开始（enter_house 事件）。 */
  G = {
    char: c,
    hp: c.hpBase, hpMax: c.hpBase, san: 58, sanMax: 58,
    skills: Object.assign({}, c.skills),
    facts: [], items: [], flags: {}, revealed: {}, attempted: {}, seenAnomalies: {}, drift: 0,
    /* 起始场景由角色决定（序幕各写各的，见 CHARACTERS[key].start） */
    sceneId: c.start || "gate", npc: { charles: "沉浸", emily: null },
    visited: [],
    em: em, rng: EnemyMachine.makeRng(seed),
    run: ++runId, ended: null, busy: false, notesShown: false, outcome: null
  };
}

/* 世界快照：交给 resolve 判定 */
function world() {
  return { actor: { hp: G.hp, hpMax: G.hpMax, san: G.san, sanMax: G.sanMax, skills: G.skills },
    facts: G.facts, items: G.items, flags: G.flags,
    scene: { id: G.sceneId, npc: G.npc }, enemy: { terror: G.em.terror, threat: G.em.threat } };
}

/* ---------- 行动列表（由状态推导） ---------- */

/* 行动是一次性的：尝试过就消失（无论成败）。
 * 一次翻找定结果 —— 找不到就是找不到，找到后也不会再留在列表里。 */
function actDone(a) {
  if (a.id && G.attempted[G.sceneId + ":" + a.id]) return true;
  // 该物品已在手（防止重复获取）
  if (G.items.indexOf(a.target) >= 0) return true;
  return false;
}

function availableActs() {
  const s = SCN(G.sceneId);
  const w = world();
  return (s.acts || []).filter((a) => {
    if (a.when && !a.when(w)) return false;
    if (a.requires && a.requires.items) {
      if (!a.requires.items.some((i) => G.items.indexOf(i) >= 0)) return false;
    }
    if (actDone(a)) return false;
    return true;
  });
}
function availableExits() {
  const s = SCN(G.sceneId);
  const w = world();
  return (s.exits || []).filter((x) => !x.when || x.when(w));
}
function SCN(id) { return Content.SCENES[id]; }

/* ---------- 右上角「调查笔记」（v1.0.3） ----------
 * 玩家此前只能在折叠的角色卡里看到已获线索：查到了什么，得先展开抽屉。
 * 这里给一个常驻入口：角标显示条数，点开随时回看；新线索到手时角标闪一下。 */
let lastClueCount = 0;

/* 第一条线索入手时是否自动翻开笔记（默认开；studio 侧可用 rules.notesAutoOpen 关掉） */
function notesAutoOpen() {
  const r = (window.GAME && window.GAME.rules) || {};
  return r.notesAutoOpen !== false;
}

function renderClues() {
  const n = G ? G.facts.length : 0;
  const firstClue = n > lastClueCount && lastClueCount === 0 && n > 0;
  const cnt = el("clue-count");
  if (cnt) {
    cnt.textContent = n;
    /* 只在真的增加时闪（首次渲染、重开一局都不闪） */
    if (n > lastClueCount) {
      const btn = el("clue-btn");
      if (btn) {
        btn.classList.remove("pulse");
        void btn.offsetWidth;          /* 强制重排，让动画能重放 */
        btn.classList.add("pulse");
      }
    }
  }
  lastClueCount = n;

  const box = el("clue-panel-body");
  if (!box) return;
  const facts = (G && G.facts.length)
    ? G.facts.map((f, i) => {
        const F = Content.FACTS[f] || { label: "情报", text: f };
        return `<div class="clue-item"><div class="clue-k">线索 ${i + 1} · ${F.label || "情报"}</div>`
             + `<div class="clue-t">${F.text}</div></div>`;
      }).join("")
    : '<div class="empty-hint">（还没有查到任何线索。调查房间、翻找东西、与人交谈，都会记进这本笔记。）</div>';
  const items = (G && G.items.length)
    ? G.items.map((i) => { const it = Content.ITEMS[i] || { name: String(i), desc: "（未知道具）" }; return `<div class="clue-card">${it.name} —— ${it.desc}</div>`; }).join("")
    : '<div class="empty-hint">（空手）</div>';
  box.innerHTML = `<div class="clue-sec">已知情报 ${n} 条 · 判定修正</div>` + facts
    + `<div class="clue-sec">持有物</div>` + items;

  /* 第一条线索入手时自动翻开一次 —— 让玩家知道「线索记在这里」；
     之后只闪角标，不再打扰。 */
  if (firstClue && G && !G.notesShown && notesAutoOpen()) {
    G.notesShown = true;
    openClues();
  }
}

function openClues() {
  renderClues();
  el("clue-panel").style.display = "block";
  el("clue-btn").classList.add("on");
}
function closeClues() {
  el("clue-panel").style.display = "none";
  el("clue-btn").classList.remove("on");
}
function toggleClues() {
  if (el("clue-panel").style.display === "block") closeClues(); else openClues();
}

/* ---------- 点一下就地展开说明（技能 / 异象强度） ----------
 * 触摸端没有 hover；iOS 上 :active 对非链接元素也不保证触发，
 * 所以说明改成「点击展开、正文插在该行下方」，同时只留一条展开项，
 * 免得抽屉被十条说明撑爆。 */
function bindTipToggles() {
  const box = el("char-body");
  if (!box || !box.addEventListener) return;
  box.addEventListener("click", function (ev) {
    const t = ev.target;
    const host = t && t.closest ? t.closest("[data-tip-body]") : null;
    if (!host) return;
    const next = host.nextElementSibling;
    if (next && next.className === "tip-body") { next.parentNode.removeChild(next); return; }
    const open = box.querySelector(".tip-body");
    if (open && open.parentNode) open.parentNode.removeChild(open);
    const d = document.createElement("div");
    d.className = "tip-body";
    d.textContent = host.getAttribute("data-tip-body") || "";
    host.parentNode.insertBefore(d, host.nextSibling);
  });
}

/* ---------- 渲染 ---------- */
function render() {
  /* 氛围层跟随世界状态：异象强度 / 敌方阶段 / 是否已结束 */
  try { FX.set(G.em.terror, G.em.phase, !!G.ended); } catch (e) {}
  const c = G.char;
  const bar = (v, m) => {
    const pct = clamp(Math.round(v / m * 100), 0, 100);
    let col = "var(--green)";
    if (pct <= 30) col = "var(--red-bright)"; else if (pct <= 55) col = "#c9a050";
    return `<div class="bar"><div class="bar-fill" style="width:${pct}%;background:${col};"></div></div>`;
  };
  const skills = Object.keys(c.skills).map((k) =>
    `<div class="skill-row" data-tip-body="${CHAR_DESC[k] || ""}"><span class="sk">${k}</span><span class="sv">${G.skills[k]}</span></div>`).join("");
  const facts = G.facts.length
    ? G.facts.map((f) => `<div class="clue-card">${Content.FACTS[f].text}</div>`).join("")
    : '<div class="empty-hint">（什么都没查出来）</div>';
  const items = G.items.length
    /* 【修复 ③】兜底：内容层写错 id 时显示「未知道具」，而不是整局崩在渲染上 */
    ? G.items.map((i) => { const it = Content.ITEMS[i] || { name: String(i), desc: "（未知道具）" }; return `<div class="clue-card">${it.name} —— ${it.desc}</div>`; }).join("")
    : '<div class="empty-hint">（空手）</div>';
  const ph = EnemyMachine.PHASES[G.em.phase];
  const tcol = G.em.terror >= 7 ? "var(--red-bright)" : (G.em.terror >= 4 ? "#c9a050" : "#6b6252");

  el("char-body").innerHTML = `
    <div class="char-name">${c.name}</div>
    <div class="char-job">${c.job}</div>
    <div class="stat-bars">
      <div class="bar-row"><div class="bar-label"><span>生命 HP</span><b>${G.hp} / ${G.hpMax}</b></div>${bar(G.hp, G.hpMax)}</div>
      <div class="bar-row"><div class="bar-label"><span>理智 SAN</span><b>${G.san} / ${G.sanMax}</b></div>${bar(G.san, G.sanMax)}</div>
      <div class="bar-row" data-tip-body="宅中未知力量的活跃程度。随你惊动宅邸与时间流逝上升；异象与理智侵蚀由它驱动。"><div class="bar-label"><span>异象强度 · ${ph.name}</span><b>${G.em.terror} / 10</b></div>${bar(G.em.terror, 10)}</div>
    </div>
    <div class="skills"><div class="panel-head" style="border:none;padding:0 0 8px;">技能（点击查看说明）</div>${skills}</div>
    <div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;">
      <div class="panel-head" style="border:none;padding:0 0 8px;color:var(--gold-dim);">已知情报（判定修正）</div>${facts}
    </div>
    <div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;">
      <div class="panel-head" style="border:none;padding:0 0 8px;color:var(--gold-dim);">持有物</div>${items}
    </div>`;

  /* 移动端常驻状态条 */
  const ms = el("mini-status");
  if (ms) {
    /* 第七日不是第二个计数器 —— 它就是敌方时钟的余量（单一真相源）。
       得知 f_ash / f_blotter / f_tally 之后，这个数才显形。 */
    const known7 = G.facts.indexOf("f_ash") >= 0 || G.facts.indexOf("f_blotter") >= 0 || G.facts.indexOf("f_tally") >= 0;
    const left7 = Math.max(0, (EnemyMachine.DAY7_CLOCK || 215) - (G.em.totalClock || 0));
    /* 显示成「还剩约几回合」：总进度每回合约走 2.5 点（含惊动与漂移），
       所以这里换算一下 —— 直接显示点数玩家没有尺度感。 */
    const turns7 = Math.max(0, Math.round(left7 / 2.5));
    ms.innerHTML = `HP <b>${G.hp}</b> · SAN <b>${G.san}</b> · 异象 <b>${G.em.terror}</b>`
      + (known7 ? ` · 第七日约 <b>${turns7}</b> 回合` : "");
  }
  renderClues();
  renderAction();
}

function renderAction() {
  const box = el("action");
  box.innerHTML = "";
  const s = SCN(G.sceneId);

  if (G.ended) {
    box.innerHTML = `<div class="pick-title">—— 调查结束 ——</div><div class="hint">${G.ended}</div>`;
    return;
  }

  const title = document.createElement("div");
  title.className = "pick-title";
  title.textContent = "当前：" + s.name;
  box.appendChild(title);

  const acts = availableActs();
  const exits = availableExits();

  if (!acts.length && !exits.length && !s.isFinal) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = "这里没什么可做的了。";
    box.appendChild(h);
  }

  /* 行动与移动统一成一个列表 */
  acts.forEach((a) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = a.label;
    btn.title = a.requires && a.requires.items ? a.fallback : "";
    btn.onclick = () => doAct(a);
    box.appendChild(btn);
  });
  exits.forEach((x) => {
    const btn = document.createElement("button");
    btn.className = "choice move";
    btn.textContent = x.label;
    btn.onclick = () => moveTo(x.to);
    box.appendChild(btn);
  });
}

/* ---------- 日志 ---------- */
function log(tag, text) {
  const box = el("log");
  const div = document.createElement("div");
  div.className = "entry";
  const t = document.createElement("span");
  t.className = "tag " + tag;
  t.textContent = { kp: "守秘人", player: "调查员", clue: "线索", roll: "检定", sys: "系统", om: "异象" }[tag] || tag;
  const p = document.createElement("p");
  p.innerHTML = text;
  div.appendChild(t); div.appendChild(p);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

/* ---------- 异象展示策略 ----------
 * 异象是【强度的表达】，不是每次行动的伴奏：
 *   · 强度上升 / 阶段跃升 → 必定展示（世界确实变了）
 *   · 强度不变           → 约 1/4 概率展示（保留氛围，但不至于让玩家脱敏）
 *   · 展示时优先挑选尚未出现过的异象，用尽后才允许重复
 */
function pickAnomaly(phase) {
  const pool = EnemyMachine.ANOMALIES[phase] || [];
  if (!pool.length) return "……";
  const unseen = pool.filter((a) => !G.seenAnomalies[a]);
  const list = unseen.length ? unseen : pool;
  const a = list[Math.floor(Math.random() * list.length)];
  G.seenAnomalies[a] = (G.seenAnomalies[a] || 0) + 1;
  return a;
}

function maybeShowAnomaly(out, prevTerror) {
  if (!out) return;
  const isEvent = EnemyMachine.ACTIONS[out.action] && EnemyMachine.ACTIONS[out.action].phaseJump != null;
  const escalated = out.escalated && !isEvent;
  const rose = out.terror > prevTerror;

  /* 理智损耗【始终】结算，与是否展示异象无关 */
  if (out.sanLoss > 0) {
    G.san = Math.max(0, G.san - out.sanLoss);
    log("sys", escalated
      ? `理智下降 <b>${out.sanLoss}</b> 点 —— 它比刚才更近了（当前 San ${G.san}）。`
      : `理智下降 <b>${out.sanLoss}</b> 点（当前 San ${G.san}）。`);
  }

  /* 以下只决定「是否展示异象」 */
  if (out.terror <= 0) return;
  if (!rose && !escalated && Math.random() >= 0.25) return;

  log("om", '<i style="color:#93a6c2;">——就在此刻：' + pickAnomaly(out.phase) + '</i>');
  try { FX.pulse(); } catch (e) {}
  if (escalated && out.escalationText) log("om", '<i style="color:#c0a3a3;">' + out.escalationText + '</i>');
}

/* ---------- 时间的自主流逝 ----------
 * 每回合累积一点「时间」，累积满 1 就让敌方时钟自行推进一步。
 * 这与玩家做了什么无关 —— 静坐不动，它也会继续醒。 */
function advanceTime() {
  if (G.ended || G.em.terminal) return;
  G.drift = (G.drift || 0) + DRIFT_RATE;
  while (G.drift >= 1) {
    G.drift -= 1;
    const prevTerror = G.em.terror;
    const out = EnemyMachine.step(G.em, "drift", G.rng);
    maybeShowAnomaly(out, prevTerror);
  }
}

/* ---------- 敌方回合 ---------- */
function enemyTurn(act, r) {
  const map = { observe: "investigate", search: "investigate", social: "wake_charles", traverse: "move" };
  let a = map[act.kind] || "move";
  /* 认知行为另有分量：凝视画像 / 研究符文在敌方行动表里躺了很久却从未被调用。
     看清了不该看清的东西，计划会被推快一点。 */
  if (act.kind === "observe" && act.target === "portrait") a = "gaze_portrait";
  if (act.kind === "observe" && act.target === "runes") a = "study_runes";
  if (act.kind === "take") a = (Content.OBJECTS[act.target].tags || []).indexOf("枢纽") >= 0 ? "take_amulet" : "move";
  if (act.kind === "destroy") a = "destroy_amulet";
  if (act.kind === "social" && (r.tierRaw === "fumble" || G.npc.charles === "敌意")) a = "alarm";
  const prevTerror = G.em.terror;
  const out = EnemyMachine.step(G.em, a, G.rng);
  maybeShowAnomaly(out, prevTerror);
  return out;
}

/* ---------- 执行行动 ---------- */
function doAct(act) {
  if (G.busy) return;
  G.busy = true;
  closeClues();            /* 已经决定要做什么了，笔记不用继续占着屏幕 */
  /* 行动一次性：立刻登记，无论结果如何都不再出现在列表里 */
  G.attempted[G.sceneId + ":" + act.id] = true;
  log("player", act.label);

  /* special：门廊那两件小事不走判定（看怀表 / 整理线索），但同样消耗一个回合 */
  if (act.special === "showClock") {
    const left7 = Math.max(0, (EnemyMachine.DAY7_CLOCK || 215) - (G.em.totalClock || 0));
    log("sys", `怀表的玻璃上全是水汽。按你数出来的吟诵节奏推算：离第七日还有约 <b>${Math.round(left7 / 2.5)}</b> 个回合。`);
    advanceTime();
    G.busy = false; render(); return;
  }
  if (act.special === "openNotes") {
    log("sys", "你把笔记摊在膝上，就着马车灯又过了一遍。");
    openClues();
    advanceTime();
    G.busy = false; render(); return;
  }

  const prevLayer = G.revealed[act.target] != null ? G.revealed[act.target] : -1;
  /* special 一并交给引擎：像「让他自己取下护符」这类行动，语义不在 kind/target 里 */
  const r = Engine.resolve(world(), { kind: act.kind, target: act.target, special: act.special }, Content);

  /* 记录揭示深度（决定该行动是否已被挖到底） */
  if (r.revealLayer >= 0) G.revealed[act.target] = Math.max(prevLayer, r.revealLayer);

  /* 是否带来实质进展 —— 无进展的行动不消耗时间，杜绝反复点击刷状态
   * 注意：所有项都必须与「已有状态」做差集，否则重复执行会被误判为新进展 */
  const progressed = (r.revealLayer > prevLayer)
    || r.newFacts.some((f) => G.facts.indexOf(f) < 0)
    || r.newItems.some((i) => G.items.indexOf(i) < 0)
    || r.delta.items.some((i) => G.items.indexOf(i) < 0)
    || Object.keys(r.delta.flags).some((k) => !G.flags[k])
    || r.delta.process.length > 0;

  /* 检定行只保留玩家需要的信息：技能 / 掷骰 / 目标 / 成败档位
   * 达成分、方式修正、难度等内部数值属于调试信息，由 DEBUG_ROLL 控制 */
  const v = r.tierRaw;
  const dbg = DEBUG_ROLL
    ? `　达成分 ${r.achScore >= 0 ? "+" : ""}${r.achScore}（方式+${r.methodBonus} 难度${r.difficulty}） → <b>${r.achievement}</b>`
    : "";
  log("roll", `<span class="roll-line">${r.skill}：掷出 <span class="big">${r.roll}</span> / 目标 ${r.target} → <span class="verdict ${v}">${r.tier}</span>${dbg}</span>`);

  /* 旁白：一次性展示本次挖到的【全部】线索层（而非只有最深一层） */
  let txt = Content.narrate(act.kind, act.target, r.achievement, act.special);
  if (r.revealedClues && r.revealedClues.length) {
    txt += "\n　　" + r.revealedClues.join("。\n　　") + "。";
  }
  /* 知识回响：用「应用句」说明这条知识此刻如何帮到你，而非复述原始线索 */
  const echoes = r.factsUsed.map((f) => Content.FACTS[f].echo).filter(Boolean);
  if (echoes.length) txt += "\n　　" + echoes.join("");
  log("kp", txt);

  /* 应用结果 */
  const gainedFacts = r.newFacts.filter((f) => G.facts.indexOf(f) < 0);
  const gainedItems = r.newItems.filter((i) => G.items.indexOf(i) < 0);
  gainedFacts.forEach((f) => G.facts.push(f));
  gainedItems.forEach((i) => G.items.push(i));
  /* 上面旁白已经把线索正文说过了，这里只做【简短标记】，
     否则同一句话会连着出现两遍（复读） */
  const marks = gainedFacts.map((f) => Content.FACTS[f].label || "情报")
    .concat(gainedItems.map((i) => Content.ITEMS[i].name));
  if (marks.length) log("clue", "已记入：" + marks.join("、"));
  Object.assign(G.flags, r.delta.flags);
  /* 无论成败都会改变的状态（如「门终究被打开了」） */
  (act.alwaysFlags || []).forEach((f) => { G.flags[f] = true; });
  /* 仅在未达成/反效果时写入的状态（如「闹出了动静」） */
  if (r.achievement === "未达成" || r.achievement === "反效果") {
    (act.failFlags || []).forEach((f) => { G.flags[f] = true; });
  }
  if (r.delta.items.length) r.delta.items.forEach((i) => { if (G.items.indexOf(i) < 0) G.items.push(i); });
  /* NPC 状态迁移：按 delta.npc 里出现的键逐个结算（支持多个 NPC） */
  const NPC_CN = { charles: "查尔斯", emily: "艾米莉" };
  Object.keys(r.delta.npc || {}).forEach((who) => {
    const nx = r.delta.npc[who];
    if (nx && nx !== G.npc[who]) {
      log("sys", `${NPC_CN[who] || who}：${G.npc[who] || "——"} → ${nx}`);
      G.npc[who] = nx;
    }
  });
  if (r.delta.process.length) log("sys", "【" + r.delta.process.join("、") + "】");
  if (r.cost.hp) { G.hp = Math.max(0, G.hp - r.cost.hp); log("sys", `你受到 ${r.cost.hp} 点伤害（HP ${G.hp}/${G.hpMax}）。`); }
  if (r.cost.san) { G.san = Math.max(0, G.san - r.cost.san); log("sys", `理智下降 ${r.cost.san} 点（San ${G.san}）。`); }

  if (progressed) enemyTurn(act, r);
  else log("sys", "（这一次没有新的进展。）");

  /* 时间自主流逝：无论有没有进展，房子都在继续醒 */
  advanceTime();

  if (G.hp <= 0) { endGame("你倒在了这座宅子里。"); }
  else if (G.san <= 0) { endGame("理智崩坏 —— 你再也分不清墙里的声音和自己的想法。"); }
  else checkDay7();

  G.busy = false;
  render();
}

/* ---------- 移动 ---------- */
function moveTo(id) {
  if (G.busy) return;
  closeClues();            /* 同上：换房间也把笔记收起来 */
  const from = G.sceneId;
  const firstVisit = G.visited.indexOf(id) < 0;
  G.sceneId = id;
  if (firstVisit) G.visited.push(id);

  const s = SCN(id);
  log("sys", "—— " + s.name + " ——");
  if (s.enter) log("kp", s.enter);
  /* 场景声明的 NPC 初始状态（如第四章妹妹到场），已存在则不覆盖 */
  if (s.npc) Object.keys(s.npc).forEach((k) => { if (!G.npc[k]) G.npc[k] = s.npc[k]; });
  /* 换房间时切换插画（只有 6 个场景有画，其余自然没有背景） */
  try { ART.show(id); } catch (e) {}

  if (s.isFinal) {
    /* 只有祭坛室那一个终局会惊动它；从后门离开的终局不走这一步 */
    if (s.altar) {
      EnemyMachine.step(G.em, "enter_altar", G.rng);
      log("om", '<i style="color:#c0a3a3;">某个庞大的存在，终于把注意力完全转向了你。</i>');
    }
    ending();
    render();
    return;
  }

  /* 移动也是时间流逝：进屋触发「低语」，首次踏足新房间消耗时钟 */
  const emAction = (from === "gate") ? "enter_house" : "move";
  if (from === "gate" || firstVisit) {
    const prevTerror = G.em.terror;
    const out = EnemyMachine.step(G.em, emAction, G.rng);
    maybeShowAnomaly(out, prevTerror);
  }
  advanceTime();   // 时间自主流逝：赶路也在消耗时间
  checkDay7();
  render();
}

/* ---------- 结局（由世界状态推导） ---------- */
/* 第七日：同一个时钟走满 = 敌方计划完成。它不是第二个计数器，也不该另开一套计时。 */
function checkDay7() {
  if (!G || G.ended || G.em.terminal) return false;
  const limit = EnemyMachine.DAY7_CLOCK || 215;
  if ((G.em.totalClock || 0) < limit) return false;
  G.ended = "结局 · 第七日：你在雨里听见钟声。等你回过头，宅子已经安静下来 —— 仪式在你面前完成了。";
  G.outcome = "bad";
  log("sys", "— — — — — — — — — —");
  log("kp", '<b style="color:var(--gold);font-size:17px;">结局 · 第七日</b>\n' + G.ended.split("：").slice(1).join("："));
  log("sys", "Demo 结束。点击「重新开始」可换一名调查员或重来一次。");
  return true;
}

function ending() {
  const hasAmulet = G.items.indexOf("amulet") >= 0;
  const destroyed = !!G.flags.ritual_destroyed;
  const lucid = G.npc.charles === "清醒";
  /* 下面这些全部来自「知识的出口」：知道得更多，走向就多一条 */
  const diary = G.facts.indexOf("f_diary") >= 0;
  const relic = G.facts.indexOf("f_crest") >= 0 && G.facts.indexOf("f_cloth") >= 0;
  const ends = G.facts.indexOf("f_ends") >= 0;
  const prints = G.facts.indexOf("f_footprints") >= 0;
  const interrupted = !!G.flags.ritual_interrupted;
  let e;
  if (destroyed && lucid && diary) e = "结局 · 黎明破晓：你与查尔斯合力毁掉了护符 —— 这一步你早就知道该怎么做，所以没有犹豫。那团黑暗发出无声的尖啸，如退潮般消散。";
  else if (destroyed && lucid) e = "结局 · 黎明破晓：你与查尔斯合力毁掉了护符。那团黑暗发出无声的尖啸，如退潮般消散。";
  else if (destroyed) e = ends
    ? "结局 · 独自了结：你毁掉了护符，却没能拉住查尔斯 —— 但你早就知道，唯有毁掉才算真的了结。黑暗退去时，祭坛前只剩你一个人。"
    : "结局 · 独自了结：你毁掉了护符，却没能拉住查尔斯。黑暗退去时，祭坛前只剩你一个人。";
  else if (interrupted && lucid && !hasAmulet) e = "结局 · 兄妹重逢：查尔斯把护符按回祭坛，用自己封住了阵眼。艾米莉在门外喊他的名字，他没有回头。";
  else if (hasAmulet && lucid) e = "结局 · 侥幸逃脱：查尔斯把你推向门口，自己转身面向那片黑暗。你攥着护符跌进雨里。";
  else if (hasAmulet && relic) e = "结局 · 送回温特家：你带着护符回到温特家。艾米莉把它锁进祖辈的柜子 —— 那柜子里，还锁着别的东西。";
  else if (hasAmulet) e = "结局 · 带走祸根：你带着护符逃出宅子。它被锁进铁盒沉入河底——可每到深夜，你总觉得它还在搏动。";
  else if (lucid) e = "结局 · 舍身相护：查尔斯挡在你身前。你跌进雨里，身后的大门轰然合拢。";
  else e = prints
    ? "结局 · 逃出生天：你丢下一切逃出宅邸 —— 门廊那串只有进入、没有离开的脚印，你始终没有告诉任何人。"
    : "结局 · 逃出生天：你丢下一切逃出宅邸。查尔斯就此人间蒸发，宅子在一场「意外」火灾中化为灰烬。";

  G.ended = e;
  G.outcome = "good";
  log("sys", "— — — — — — — — — —");
  log("kp", `<b style="color:var(--gold);font-size:17px;">${e.split("：")[0]}</b>\n${e.split("：").slice(1).join("：")}`);
  log("sys", "Demo 结束。点击「重新开始」可换一名调查员或重来一次。");
}
function endGame(msg) { G.ended = msg; G.outcome = "death"; log("sys", "— — — — — — — — — —"); log("kp", "<b>" + msg + "</b>"); }

/* ---------- 选角与启动 ---------- */
function buildCharModal() {
  const wrap = el("char-cards");
  wrap.innerHTML = "";
  Object.values(CHARACTERS).forEach((c) => {
    const card = document.createElement("div");
    card.className = "char-card";
    card.innerHTML = `<h3>${c.name}</h3><div class="role">${c.job}</div>
      <ul>${c.blurb.map((b) => "<li>· " + b + "</li>").join("")}</ul>`;
    card.onclick = () => start(c.key);
    wrap.appendChild(card);
  });
}

function start(key) {
  initGame(key);
  el("char-modal").style.display = "none";
  el("log").innerHTML = "";
  closeClues();            /* 新一局从干净的笔记开始 */
  render();
  log("sys", `你选择了调查员 <b>${G.char.name}</b>（${G.char.job}）。`);
  /* 开场白由角色决定：侦探从侦探所出发，医生从自己家里出发 —— 动机不同，路径不同 */
  (G.char.open || []).forEach((line) => log("kp", line));
  const s = SCN(G.sceneId);
  log("sys", "—— " + s.name + " ——");
  if (s.enter) log("kp", s.enter);
  try { ART.show(G.sceneId); } catch (e) {}
  /* 新手引导：先把「线索」入口指出来，再让玩家做第一次检定 */
  log("sys", "提示：右上角「线索」会记下你查到的一切 —— 它们都会变成之后判定的加成。");
}

function resetGame() {
  G = null;
  el("log").innerHTML = "";
  el("action").innerHTML = "";
  closeClues();
  renderClues();           /* G 已清空 → 角标归零 */
  el("char-body").innerHTML = '<div class="empty-hint">请先选择一名调查员开始。</div>';
  el("title-screen").style.display = "none";
  el("char-modal").style.display = "flex";
}

function renderChangelog() {
  el("changelog-body").innerHTML = CHANGELOG.map((c) => `
    <h3>v${c.version} · ${c.title}</h3><div class="vmeta">${c.date}</div>
    <ul>${c.highlights.map((h) => `<li>${h}</li>`).join("")}</ul>
    ${c.fixes && c.fixes.length ? `<ul>${c.fixes.map((f) => `<li class="fix">${f}</li>`).join("")}</ul>` : ""}`).join("");
}

/* 弹窗显隐：统一走这里，避免各处内联样式写法不一致 */
function show(id) { var e = el(id); if (e) { e.style.display = "flex"; e.style.visibility = "visible"; } }
function hide(id) { var e = el(id); if (e) e.style.display = "none"; }

function bootSequence() {
  window.__dshBooted = true;
  if (window.__bootCheck) window.__bootCheck("已就绪 · 构建 1126115824");
  /* ① 最先绑定关键按钮 —— 即使后面任何渲染出错，主流程也不会卡死。
        （旧内核上「点了开始游戏没反应」的典型原因就是绑定排在渲染之后） */
  el("start-btn").onclick = function () { hide("title-screen"); show("howto-modal"); };
  el("howto-ok").onclick = function () { hide("howto-modal"); show("char-modal"); };
  /* 「重新开始」是破坏性操作，而且就贴在行动列表下方 ——
     移动端一次误触就把整局清空。改成「再点一次确认」，不弹窗。 */
  var resetArmed = 0, resetTimer = null;
  el("reset-btn").onclick = function () {
    var btn = el("reset-btn");
    if (!resetArmed) {
      resetArmed = 1;
      btn.textContent = "再点一次，确认重新开始";
      btn.classList.add("armed");
      resetTimer = setTimeout(function () {
        resetArmed = 0; btn.textContent = "重新开始"; btn.classList.remove("armed");
      }, 3000);
      return;
    }
    if (resetTimer) clearTimeout(resetTimer);
    resetArmed = 0;
    btn.textContent = "重新开始";
    btn.classList.remove("armed");
    resetGame();
  };

  /* 竖屏唯一形态，所以抽屉在全宽度可用（原先只在 ≤820px 才允许展开，
     桌面宽窗口下点了没反应） */
  el("char-head").onclick = function () {
    try {
      var p = el("panel-char");
      p.classList.toggle("open");
      el("char-toggle").textContent = p.classList.contains("open") ? "收起 ▴" : "详情 ▾";
    } catch (e) {}
  };

  /* 右上角「线索」：点开调查笔记（已知情报 + 持有物），点面板外任意处收起 */
  el("clue-btn").onclick = function (ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    toggleClues();
  };
  el("clue-close").onclick = function (ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    closeClues();
  };
  document.addEventListener("pointerdown", function (ev) {
    var p = el("clue-panel");
    if (!p || p.style.display !== "block") return;
    var t = ev.target;
    if (t && t.closest && (t.closest("#clue-btn") || t.closest("#clue-panel"))) return;
    closeClues();
  }, true);
  try { renderClues(); } catch (e) {}
  try { bindTipToggles(); } catch (e) {}

  var openLog = function () { show("changelog-modal"); };
  el("version-btn-title").onclick = openLog;
  el("version-btn-footer").onclick = openLog;
  el("changelog-close").onclick = function () { hide("changelog-modal"); };

  /* ② 初始界面：只显示标题界面 */
  hide("howto-modal"); hide("char-modal"); hide("changelog-modal");
  show("title-screen");

  /* ③ 渲染型初始化放最后，各自隔离，任何一个失败都不影响其余功能 */
  try { buildCharModal(); }
  catch (e) { el("char-cards").innerHTML = "<div class='empty-hint'>角色卡加载失败：" + e.message + "</div>"; }
  try { renderChangelog(); }
  catch (e) { el("changelog-body").innerHTML = "<div class='empty-hint'>版本公告加载失败</div>"; }

  /* ④ 氛围层：同样隔离，它失败不影响游戏本身可玩 */
  try { FX.boot(); } catch (e) {}
  /* ⑤ 场景插画：同样隔离 */
  try { ART.build(); } catch (e) {}
}

/* ---------- A1 氛围层：雨（Canvas 2D）----------
 * 设计取舍：这游戏的主体是文本 DOM，WebGL 是持续渲染、要一直占 GPU；
 * 而 three.js 必须整包内联（CSP 禁外链），体积会从 172 KB 涨到约 904 KB。
 * 雨用 Canvas 2D 画只花十几 KB —— 观感收益的大头在这里就能拿到。
 * 三条自我约束：
 *   ① 粒子数按面积自适应 + 连续掉帧自动减半（低端机不至于卡）
 *   ② 切到后台标签页就暂停（省电）
 *   ③ 系统开了「减弱动态效果」就彻底不画雨，只留静态雾与晕影 */
var FX = (function () {
  var cvs = document.getElementById("fx-rain");
  var layer = document.getElementById("fx");
  var vig = document.getElementById("fx-vig");
  var noop = { boot: function () {}, set: function () {}, pulse: function () {} };
  if (!cvs || !cvs.getContext || !layer) return noop;
  var ctx = cvs.getContext("2d");
  var mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  var W = 0, H = 0, drops = [], raf = 0, running = false;
  var level = 0, frames = 0, fpsT = 0, slow = 0;

  function reduced() { return !!(mq && mq.matches); }
  function want() {
    if (reduced()) return 0;
    return clamp(Math.round((W * H) / 9000), 40, 150);
  }
  function seed() {
    var n = want(), i;
    drops = [];
    for (i = 0; i < n; i++) {
      drops.push({ x: Math.random() * W, y: Math.random() * H,
        len: 9 + Math.random() * 22, sp: 5 + Math.random() * 9, a: 0.05 + Math.random() * 0.09 });
    }
  }
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = layer.clientWidth || window.innerWidth;
    H = layer.clientHeight || window.innerHeight;
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    if (ctx.setTransform) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }
  function frame(now) {
    if (!running) return;
    /* 掉帧保护：连续两秒低于 40fps 就把粒子减半 */
    if (!fpsT) { fpsT = now; frames = 0; }
    frames++;
    if (now - fpsT > 1000) {
      var fps = frames * 1000 / (now - fpsT);
      if (fps < 40) {
        slow++;
        if (slow >= 2 && drops.length > 30) { drops.length = Math.floor(drops.length / 2); slow = 0; }
      } else slow = 0;
      frames = 0; fpsT = now;
    }
    ctx.clearRect(0, 0, W, H);
    var speedUp = 1 + level * 0.06;
    var slant = 0.16 + level * 0.012;
    ctx.lineWidth = 1;
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      d.y += d.sp * speedUp; d.x += d.sp * slant;
      if (d.y > H + 24) { d.y = -24; d.x = Math.random() * W; }
      if (d.x > W + 24) d.x = -24;
      ctx.strokeStyle = "rgba(192,206,226," + (d.a * (0.65 + level * 0.05)).toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.len * slant, d.y - d.len);
      ctx.stroke();
    }
    raf = requestAnimationFrame(frame);
  }
  function start() { if (running || !drops.length) return; running = true; fpsT = 0; raf = requestAnimationFrame(frame); }
  function stop() { running = false; if (raf && cancelAnimationFrame) cancelAnimationFrame(raf); raf = 0; }

  return {
    boot: function () {
      resize();
      start();
      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("orientationchange", function () { setTimeout(resize, 300); }, { passive: true });
      document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else start(); });
      if (mq && mq.addEventListener) {
        mq.addEventListener("change", function () {
          resize();
          if (want()) start();
          else { stop(); ctx.clearRect(0, 0, W, H); }
        });
      }
    },
    /* 由 render() 调用：异象越高，雨越急、晕影越重 */
    set: function (terror, phase, ended) {
      level = clamp(Math.round(terror || 0), 0, 10);
      if (document.body) document.body.setAttribute("data-phase", String(phase || 0));
      if (vig) vig.style.setProperty("--fx-vig", (0.20 + level * 0.028).toFixed(3));
      cvs.style.opacity = ended ? "0.3" : "1";
    },
    /* 异象真正出现时抖一下（只抖氛围层，不抖文字） */
    pulse: function () {
      if (reduced()) return;
      layer.className = "";
      void layer.offsetWidth;          /* 强制重排，让动画能重新触发 */
      layer.className = "pulse";
      setTimeout(function () { layer.className = ""; }, 700);
    }
  };
})();

/* ---------- A2 场景插画：两层交替淡入淡出 ----------
 * background-image 不支持过渡，所以用两个绝对定位层交叉淡化。
 * SVG 存在 content.js 里是原文，运行时编码成 data URI ——
 * 比 base64 省约 33%，源码也保持可读可 diff。
 * 插画只覆盖 6 个场景，其余场景自然没有背景（不会留白块）。 */
var ART = (function () {
  var slots = [], cur = -1, curId = null, host = null;
  function uri(svg) { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }
  return {
    build: function () {
      host = document.querySelector(".panel-log");
      if (!host || !Content.SCENE_ART) return;
      /* 先插压暗层，再插两个插画槽：insertBefore(firstChild) 会让后插的排在前面，
         所以 DOM 顺序最终是 [槽1, 槽0, 压暗层] —— 压暗层正好盖在插画上、文字之下。 */
      var scrim = document.createElement("div");
      scrim.className = "scene-scrim";
      host.insertBefore(scrim, host.firstChild);
      for (var i = 0; i < 2; i++) {
        var d = document.createElement("div");
        d.className = "scene-bg";
        host.insertBefore(d, host.firstChild);
        slots.push(d);
      }
    },
    show: function (id) {
      if (!slots.length || id === curId) return;
      curId = id;
      var svg = Content.SCENE_ART[id];
      if (!svg) {
        for (var k = 0; k < slots.length; k++) slots[k].style.opacity = "0";
        cur = -1;
        return;
      }
      var next = cur === 0 ? 1 : 0;
      slots[next].style.backgroundImage = 'url("' + uri(svg) + '")';
      slots[next].style.opacity = ".34";
      if (cur >= 0) slots[cur].style.opacity = "0";
      cur = next;
    }
  };
})();

/* 兼容极旧内核：若 DOMContentLoaded 已经错过，直接执行 */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootSequence);
else bootSequence();


/* ==================== ⑤ DSH Game Studio 桥接层（新增） ====================
 * 这是一个「纯选项」游戏：没有方向键、没有主角坐标，所以按 studio 的约定
 * 提供 __autoplay(state)，让无头试玩能通过游戏自己的函数推进真实流程。
 * ========================================================================= */
(function studioBridge() {
  "use strict";

  var R = (window.GAME && window.GAME.rules) || {};
  var STEP_MS = typeof R.autoplayStepMs === "number" ? R.autoplayStepMs : 220;

  /* ---- fps：studio 的试玩报告要读 ---- */
  var frames = 0, fps = 0, fpsAt = Date.now();
  (function loop() {
    frames++;
    var now = Date.now();
    if (now - fpsAt >= 1000) { fps = Math.round(frames * 1000 / (now - fpsAt)); frames = 0; fpsAt = now; }
    requestAnimationFrame(loop);
  })();

  function shown(id) {
    var e = document.getElementById(id);
    return !!e && e.style.display !== "none";
  }
  function tap(id) {
    var e = document.getElementById(id);
    if (e) { e.click(); return true; }
    return false;
  }

  /* ---- 开局：tap 与 Enter 都必须能真的开始 ----
   * studio 的试玩只用「一次点屏 + 一次 Enter」开局，之后就一直调 __autoplay；
   * 而本作的开场是标题 → 说明 → 选角三步，所以：
   *   · 触摸：点标题页/说明页任意处 = 下一步（角色卡仍由卡片自己处理，避免误选）
   *   · 键盘：Enter / 空格 = 快速开始（跳过说明与选角，用第一名调查员）
   * 两者对真人玩家都是可用路径，不是测试开关。 */
  function introModal() {
    if (shown("title-screen")) return "title-screen";
    if (shown("howto-modal")) return "howto-modal";
    if (shown("char-modal")) return "char-modal";
    return null;
  }
  function advance(id) {
    if (id === "title-screen") { hide("title-screen"); show("howto-modal"); return true; }
    if (id === "howto-modal") { hide("howto-modal"); show("char-modal"); return true; }
    return false;
  }
  function quickStart() {
    var keys = Object.keys(CHARACTERS || {});
    if (!keys.length) return false;
    start(keys[0]);
    hide("title-screen"); hide("howto-modal"); hide("char-modal");
    return true;
  }
  document.addEventListener("pointerdown", function (ev) {
    var id = introModal();
    if (!id) return;
    var t = ev.target;
    if (id === "char-modal" && t && t.closest && t.closest(".char-card")) return;
    advance(id);
  }, true);
  window.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
    if (!introModal()) return;
    if (ev.preventDefault) ev.preventDefault();
    quickStart();
  }, true);

  /* 把快捷键写在标题页上，别做隐藏操作 */
  try {
    var ti = document.querySelector("#title-screen .title-inner");
    if (ti && !document.getElementById("wugu-keyhint")) {
      var hint = document.createElement("div");
      hint.id = "wugu-keyhint";
      hint.className = "title-en";
      hint.style.marginTop = "12px";
      hint.textContent = "回车 / 空格：快速开始（跳过说明与选角）";
      ti.appendChild(hint);
    }
  } catch (e) {}

  /* ---- 状态快照：studio 约定的字段 + 本作自己的诊断字段 ---- */
  window.__gameState = function () {
    var g = (typeof G !== "undefined" && G) ? G : null;
    var onTitle = shown("title-screen") || shown("howto-modal") || shown("char-modal");
    var phase = "title";
    if (g && !onTitle) {
      if (g.ended) {
        /* 游戏自己在 G.outcome 里标了性质：good=走到某个结局 / bad=第七日 / death=HP·SAN 归零 */
        if (g.outcome === "good") phase = "won";
        else if (g.outcome) phase = "lost";
        else phase = String(g.ended).indexOf("结局") === 0 ? "won" : "lost";
      } else phase = "playing";
    }
    return {
      phase: phase,
      score: g ? g.facts.length * 10 + g.items.length * 5 + g.visited.length : 0,
      hearts: g ? g.hp : 0,
      fps: fps,
      hero: { x: 0, y: 0 },
      pickups: [],
      enemies: [],
      world: { w: window.innerWidth, h: window.innerHeight },
      /* 额外诊断（studio 只强制上面的字段） */
      san: g ? g.san : 0,
      terror: g ? g.em.terror : 0,
      scene: g ? g.sceneId : "",
      clues: g ? g.facts.length : 0,
      items: g ? g.items.length : 0,
      visited: g ? g.visited.length : 0,
      ended: g ? (g.ended || null) : null,
    };
  };

  /* ---- 自动驾驶：一步一个真实动作 ----
   * 标题 → 说明 → 选角（随机一名，覆盖不同角色）
   * 游戏中：优先做「调查/交涉/取物」类行动（吃到内容），
   *         本场景行动挖完后，走去过次数最少的出口（避免 A↔B 打转）。 */
  var lastStep = 0, visits = {}, stuck = 0;

  window.__autoplay = function () {
    var now = Date.now();
    if (now - lastStep < STEP_MS) return;
    lastStep = now;

    if (shown("title-screen")) { tap("start-btn"); return; }
    if (shown("howto-modal")) { tap("howto-ok"); return; }
    if (shown("char-modal")) {
      var cards = document.querySelectorAll("#char-cards .char-card");
      if (cards.length) { cards[Math.floor(Math.random() * cards.length)].click(); return; }
    }

    if (typeof G === "undefined" || !G) return;
    if (G.ended) return;

    var acts = availableActs();
    if (acts.length) { stuck = 0; doAct(acts[0]); return; }

    var exits = availableExits();
    if (exits.length) {
      stuck = 0;
      var best = exits[0], bestN = Infinity;
      for (var i = 0; i < exits.length; i++) {
        var n = visits[exits[i].to] || 0;
        if (n < bestN) { bestN = n; best = exits[i]; }
      }
      visits[best.to] = (visits[best.to] || 0) + 1;
      moveTo(best.to);
      return;
    }

    /* 死路：连撞三次就重开一局换个人继续跑，别让无头试玩空转 */
    if (++stuck >= 3) { stuck = 0; visits = {}; resetGame(); }
  };
})();
</script>
</body></html>
